services:
  # docker run --name database -d -v postgres_data_volume:/var/lib/postgresql -e POSTGRES_PASSWORD=12345 -p 5432:5432 postgres:18
  database:
    image: postgres:18
    container_name: database
    ports:
      - 5432:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=12345

  # docker run --name go_gin_be_container -d -p 8002:8080 --env-file=.env go_gin_be_image
  go_gin_be:
    image: go_gin_be_image
    container_name: go_gin_be
    ports:
      - 8002:8080
    env_file:
      - ../go_gin_be/.env
    depends_on:
      - database

  # docker run --name java_be_container -d -p 8003:8080 --env-file=.env java_be_image
  java_be:
    image: java_be_image
    container_name: java_be
    ports:
      - 8003:8080
    env_file:
      - ../java_be/.env
    depends_on:
      - database

# docker run --name js_nestjs_container -d -p 8004:3000 --env-file=.env js_nestjs_image
  js_nestjs:
    image: js_nestjs_image
    container_name: js_nestjs
    ports:
      - 8004:3000
    env_file:
      - ../js_nestjs/.env
    depends_on:
      - database

volumes:
  postgres-data:

networks:
  demo_network:
    external: true
